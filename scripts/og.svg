<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#c8622a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c8622a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8622a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#181614"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- cube logo, top-right -->
  <g transform="translate(1010,72) scale(1.9)" fill="none" stroke="#c8622a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M28 2 L53 15 L28 28 L3 15 Z"/>
    <path d="M3 15 L28 28 L28 54 L3 41 Z"/>
    <path d="M28 28 L53 15 L53 41 L28 54 Z"/>
    <line x1="9" y1="18" x2="9" y2="44"/>
    <line x1="15" y1="21" x2="15" y2="47"/>
    <line x1="21" y1="24" x2="21" y2="50"/>
    <line x1="35" y1="24" x2="35" y2="50"/>
    <line x1="42" y1="21" x2="42" y2="47"/>
    <line x1="49" y1="17" x2="49" y2="43"/>
  </g>

  <!-- available tag -->
  <circle cx="97" cy="148" r="7" fill="#c8622a"/>
  <text x="118" y="156" font-family="monospace" font-size="22" letter-spacing="6" fill="#c8622a">AVAILABLE FOR WORK</text>

  <!-- name -->
  <text x="90" y="335" font-family="sans-serif" font-weight="bold" font-size="104" letter-spacing="1" fill="#D6D9D0">QUINTIN EDWARDS</text>

  <!-- tagline -->
  <text x="94" y="405" font-family="monospace" font-size="34" fill="#7d7b78">Self-taught developer &amp; builder</text>

  <!-- bottom rule + location/domain -->
